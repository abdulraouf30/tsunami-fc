<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تشكيلة لاعبي فريق تسونامي</title>
    <style>
        body {
            background-color: #3b092f;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 20px 10px;
        }
        h1 {
            color: #ffcc00;
        }
        .box {
            background-color: #4e123e;
            margin: 15px auto;
            padding: 15px;
            width: 340px;
            border-radius: 10px;
            border: 2px solid #ffcc00;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        h2 {
            color: #4ade80;
            font-size: 18px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background-color: #5d164c;
            margin: 8px auto;
            padding: 10px;
            width: 300px;
            border-radius: 5px;
            border: 1px solid #7a1f63;
            font-size: 15px;
        }
        .back-btn {
            display: inline-block;
            background-color: #ffcc00;
            color: #3b092f;
            padding: 10px 20px;
            margin-top: 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #ffdd44;
        }
    </style>
</head>
<body>
    <h1>قائمة أبطال فريق تسونامي ⚽</h1>
    <p>تفاصيل نجوم ملعب لوسيل في عتق</p>

    <div class="box">
        <h2>🧤 حراسة المرمى:</h2>
        <ul>
            <li>[اكتب اسم الحارس]</li>
        </ul>
    </div>

    <div class="box">
        <h2>🛡️ خط الدفاع:</h2>
        <ul>
            <li>عدنان</li>
            <li>رامي</li>
            <li>سيف</li>
            <li>وائل</li>
        </ul>
    </div>

    <div class="box">
        <h2>⚡ خط الوسط:</h2>
        <ul>
            <li>معاذ</li>
            <li>محمد</li>
            <li>طارق</li>
            <li>خوي</li>
        </ul>
    </div>

    <div class="box">
        <h2>🎯 خط الهجوم:</h2>
        <ul>
            <li>كنج</li>
            <li>نبيل</li>
            <li>ياسر</li>
            <li>سالم</li>
        </ul>
    </div>

    <!-- زر الرجوع للرئيسية -->
    <a href="index.html" class="back-btn">⬅ العودة إلى الصفحة الرئيسية</a>
</body>
</html>
